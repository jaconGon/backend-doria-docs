components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    ErrorResponse:
      type: object
      properties:
        Error:
          type: string
          description: Mensagem de erro principal.
        error:
          type: string
          description: Mensagem de erro alternativa; nem todos os endpoints retornam este campo.
        retry_after_seconds:
          type: integer
          description: Tempo até nova tentativa, quando aplicável.
      additionalProperties: true
    StatusResponse:
      type: object
      properties:
        Status:
          type: string
        status:
          type: string
      additionalProperties: true
    JwtSessionPayload:
      type: object
      properties:
        sub:
          type: string
          format: uuid
          description: auth_id do usuário ou UUID anônimo.
        last:
          type: integer
          description: Timestamp em milissegundos da última atividade.
        anon:
          type: boolean
        doctorId:
          type: string
          format: uuid
          nullable: true
        nome:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        tipo:
          type: string
          nullable: true
          enum:
          - paciente
          - especialista
        cpf:
          type: string
          nullable: true
      required:
      - sub
      - last
      - anon
      additionalProperties: true
    PublicUser:
      type: object
      properties:
        id_usuario:
          type: string
          format: uuid
        auth_id:
          type: string
          format: uuid
        nome:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        tipo:
          type: string
          nullable: true
          enum:
          - paciente
          - especialista
        cpf:
          type: string
          nullable: true
        notif_medicacoes:
          type: boolean
          nullable: true
        notif_jornada:
          type: boolean
          nullable: true
        notif_avaliacao:
          type: boolean
          nullable: true
        notif_consultas:
          type: boolean
          nullable: true
        termos_uso_aceito:
          type: boolean
          nullable: true
        politica_privacidade_aceita:
          type: boolean
          nullable: true
        versao_termo:
          type: string
          nullable: true
      additionalProperties: true
    AuthenticatedUserResponse:
      type: object
      properties:
        Status:
          type: string
        status:
          type: string
        token:
          type: string
          description: JWT próprio da API. Pode ser usado como Bearer token.
        user:
          $ref: '#/components/schemas/PublicUser'
        provider:
          type: string
          nullable: true
        created:
          type: boolean
          nullable: true
        mode:
