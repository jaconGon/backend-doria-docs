
openapi: 3.0.3

info:
  title: Fale com a Dória - Backend API
  version: "1.0.0"
  description: |
    Documentação técnica da API backend do projeto Fale com a Dória.

    Esta especificação foi gerada a partir da análise estática do código-fonte do backend.
    O objetivo é orientar o time de frontend sobre endpoints, métodos HTTP, payloads,
    respostas de sucesso, respostas de erro e regras de autenticação.

    Convenções gerais:
      - A API usa Fastify.
      - A maioria das rotas protegidas aceita autenticação via cookie HTTP-only "token"
        ou via header "Authorization: Bearer <token>".
      - O token local é um JWT próprio do backend, emitido em /login, /auth/session,
        /auth/onboard e /consent.
      - Sessões anônimas são criadas por /consent e servem principalmente para o chat.
      - Para rotas protegidas de dados do usuário, o backend resolve o usuário autenticado
        usando o campo "sub" do JWT, que representa o auth_id do Supabase.
      - Erros usam, em geral, o formato:
          { "Error": "mensagem" }
      - Respostas de sucesso usam, em geral, o campo "Status".

    Observações importantes para frontend:
      - Rotas PATCH existem e são usadas para atualização.
      - No código atual, o CORS registra métodos POST, GET, OPTIONS, PUT e DELETE,
        mas não registra PATCH. Em navegador, isso pode bloquear PATCH no preflight
        até o backend incluir PATCH na configuração de CORS.
      - O timeout de inatividade retorna HTTP 440 com:
          { "Error": "token is not ok (idle timeout)" }
      - A renovação do campo "last" da sessão ocorre explicitamente no chat
        /send-message-n8n. As demais rotas protegidas validam a sessão, mas não renovam
        o cookie no código atual.

servers:
  - url: https://api.falecomadoria.com.br
    description: Produção provável
  - url: http://localhost:3433
    description: Desenvolvimento local padrão

tags:
  - name: Health
    description: Verificação básica da API e da sessão.
  - name: Auth
    description: Autenticação, cadastro, sessão local e senha.
  - name: Chat
    description: Consentimento anônimo e envio de mensagens ao n8n.
  - name: Usuario
    description: Perfil do usuário autenticado.
  - name: Consultas
    description: Agenda/consultas do paciente.
  - name: Minha Jornada
    description: Registros de jornada, dor, sono e emocional.
  - name: Enderecos
    description: Endereços do usuário.
  - name: Medicacoes
    description: Medicações do usuário.
  - name: Controle Medicacoes
    description: Controle de tomada de medicações.
  - name: Evolucao
    description: Avaliação/evolução de dor.
  - name: Especialistas
    description: Cadastro e certificação de especialistas.
  - name: Clinicas
    description: Clínicas vinculadas a especialistas.
  - name: Convenios
    description: Convênios vinculados a clínicas.
  - name: Horario Atendimento
    description: Horários de atendimento vinculados a clínicas.

paths:
  /:
    get:
      tags:
        - Health
      summary: Health check e status de sessão
      description: |
        Verifica se a API está respondendo e, quando houver cookie "token",
        informa se a sessão local ainda é válida.

        Esta rota não exige autenticação.
      operationId: getHealth
      responses:
        "200":
          description: API respondendo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                semSessao:
                  value:
                    Status: Success
                    hasSession: false
                comSessao:
                  value:
                    Status: Success
                    hasSession: true

  /auth/signup:
    post:
      tags:
        - Auth
      summary: Cadastrar usuário com e-mail e senha
      description: |
        Cria um usuário no Supabase Auth e cria/garante o perfil correspondente
        na tabela doria.usuario.

        O backend exige email e password. A senha deve ter pelo menos 8 caracteres.
        O campo tipo, quando omitido, tende a ser tratado como "paciente" no serviço.
      operationId: postAuthSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignupRequest"
            examples:
              paciente:
                value:
                  email: paciente@example.com
                  password: senhaSegura123
                  nome: Maria Paciente
                  tipo: paciente
                  cpf: "12345678901"
              especialista:
                value:
                  email: especialista@example.com
                  password: senhaSegura123
                  nome: Dr. João Especialista
                  tipo: especialista
                  cpf: "12345678901"
      responses:
        "200":
          description: Cadastro criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSignupSuccess"
              example:
                Status: created
                auth_id: 11111111-1111-4111-8111-111111111111
                email: paciente@example.com
                needs_email_confirm: true
        "400":
          description: Dados inválidos ou erro retornado pelo Supabase Auth.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                camposObrigatorios:
                  value:
                    Error: E-mail e senha são obrigatórios.
                senhaCurta:
                  value:
                    Error: A senha deve ter pelo menos 8 caracteres.
                emailInvalido:
                  value:
                    Error: E-mail inválido.
        "409":
          description: Usuário/e-mail já existente, quando identificado pelo backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Falha ao criar ou consultar perfil usuario no banco.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /login:
    post:
      tags:
        - Auth
      summary: Login por e-mail e senha
      description: |
        Autentica no Supabase Auth e cria uma sessão local do backend.

        Em caso de sucesso:
          - grava cookie HTTP-only "token";
          - retorna o token também no corpo da resposta, útil para mobile;
          - retorna dados básicos do usuário.

        O e-mail precisa estar confirmado no Supabase.
      operationId: postLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: paciente@example.com
              password: senhaSegura123
      responses:
        "200":
          description: Login realizado e sessão local criada.
          headers:
            Set-Cookie:
              description: Cookie HTTP-only "token" contendo JWT local.
              schema:
                type: string
                example: token=eyJhbGciOiJIUzI1NiIs...; HttpOnly; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccess"
              example:
                Status: success
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  nome: Maria Paciente
                  email: paciente@example.com
                  tipo: paciente
        "401":
          description: Credenciais inválidas ou erro de autenticação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Credenciais inválidas.
        "403":
          description: E-mail ainda não confirmado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: E-mail ainda não confirmado. Verifique sua caixa de entrada e spam.
        "500":
          description: Falha ao consultar ou criar perfil usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/google:
    post:
      tags:
        - Auth
      summary: Login ou cadastro com Google
      description: |
        Valida um id_token do Google via Supabase Auth e cria uma sessão local do backend.

        Este endpoint serve para:
          - login de usuário Google já cadastrado;
          - cadastro automático no primeiro acesso com Google.

        Campos aceitos:
          - id_token: token Google obrigatório, salvo se o alias token for usado.
          - token: alias de id_token.
          - nonce: opcional, repassado à validação Supabase.
          - tipo: opcional; quando omitido, tende a ser tratado como "paciente".
          - nome: opcional; usado como fallback se o Google não retornar nome.
          - cpf: opcional; útil principalmente no cadastro de especialista.
      operationId: postAuthGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthRequest"
            examples:
              login:
                value:
                  id_token: GOOGLE_ID_TOKEN
              cadastroPaciente:
                value:
                  id_token: GOOGLE_ID_TOKEN
                  tipo: paciente
              cadastroEspecialista:
                value:
                  id_token: GOOGLE_ID_TOKEN
                  tipo: especialista
                  nome: Dr. João Especialista
                  cpf: "12345678901"
              usandoAliasToken:
                value:
                  token: GOOGLE_ID_TOKEN
      responses:
        "200":
          description: Login/cadastro Google realizado e sessão local criada.
          headers:
            Set-Cookie:
              description: Cookie HTTP-only "token" contendo JWT local.
              schema:
                type: string
                example: token=eyJhbGciOiJIUzI1NiIs...; HttpOnly; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleAuthSuccess"
              examples:
                login:
                  value:
                    Status: success
                    status: success
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    provider: google
                    created: false
                    mode: login
                    user:
                      id_usuario: 22222222-2222-4222-8222-222222222222
                      auth_id: 11111111-1111-4111-8111-111111111111
                      nome: Maria Paciente
                      email: paciente@example.com
                      tipo: paciente
                      cpf: "12345678901"
                      notif_medicacoes: true
                      notif_jornada: true
                      notif_avaliacao: false
                      notif_consultas: true
                signup:
                  value:
                    Status: success
                    status: success
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    provider: google
                    created: true
                    mode: signup
                    user:
                      id_usuario: 22222222-2222-4222-8222-222222222222
                      auth_id: 11111111-1111-4111-8111-111111111111
                      nome: Maria Paciente
                      email: paciente@example.com
                      tipo: paciente
                      cpf: null
                      notif_medicacoes: null
                      notif_jornada: null
                      notif_avaliacao: null
                      notif_consultas: null
        "400":
          description: Token Google ausente ou conta Google sem e-mail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idTokenObrigatorio:
                  value:
                    Error: id_token do Google é obrigatório.
                    error: id_token do Google é obrigatório.
                emailAusente:
                  value:
                    Error: A conta Google não retornou e-mail.
                    error: A conta Google não retornou e-mail.
        "401":
          description: Token Google inválido ou rejeitado pelo Supabase Auth.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tokenInvalido:
                  value:
                    Error: Token Google inválido ou sem usuário no Supabase.
                    error: Token Google inválido ou sem usuário no Supabase.
        "500":
          description: Falha ao criar ou recuperar perfil usuario a partir do Google.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Falha ao criar ou recuperar perfil usuario a partir do Google.
                error: Falha ao criar ou recuperar perfil usuario a partir do Google.
  /auth/session:
    post:
      tags:
        - Auth
      summary: Criar sessão local usando access_token do Supabase
      description: |
        Recebe um access_token válido do Supabase, consulta o usuário e cria
        uma sessão local do backend.

        Esta rota exige que já exista perfil correspondente na tabela doria.usuario.
        Se não existir, retorna 404.
      operationId: postAuthSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenRequest"
            example:
              access_token: supabase-access-token
      responses:
        "200":
          description: Sessão local criada.
          headers:
            Set-Cookie:
              description: Cookie HTTP-only "token" contendo JWT local.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionSuccess"
              example:
                Status: success
                user:
                  id_usuario: 22222222-2222-4222-8222-222222222222
                  auth_id: 11111111-1111-4111-8111-111111111111
                  email: paciente@example.com
                  nome: Maria Paciente
                  tipo: paciente
                  cpf: "12345678901"
                  notif_medicacoes: true
                  notif_jornada: true
                  notif_avaliacao: false
                  notif_consultas: true
        "400":
          description: access_token não enviado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: access_token é obrigatório.
        "401":
          description: Token Supabase inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Sessão inválida.
        "404":
          description: Perfil não encontrado na tabela usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Perfil não encontrado no banco de dados.

  /auth/onboard:
    post:
      tags:
        - Auth
      summary: Alias de /auth/session para onboarding pós-OAuth
      description: |
        Funciona como alias semântico de /auth/session.

        Importante: no código atual, esta rota não cria perfil novo.
        Ela exige que já exista perfil na tabela doria.usuario.
      operationId: postAuthOnboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenRequest"
            example:
              access_token: supabase-access-token
      responses:
        "200":
          description: Sessão local criada.
          headers:
            Set-Cookie:
              description: Cookie HTTP-only "token" contendo JWT local.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionSuccess"
        "400":
          description: access_token não enviado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: access_token é obrigatório.
        "401":
          description: Token Supabase inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Sessão inválida.
        "404":
          description: Perfil não encontrado na tabela usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Perfil não encontrado no banco de dados.

  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Solicitar recuperação de senha
      description: |
        Dispara fluxo de recuperação de senha via Supabase Auth.

        O e-mail de recuperação usa a URL configurada no backend por
        PASSWORD_RESET_REDIRECT_URL.
      operationId: postAuthForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
            example:
              email: paciente@example.com
      responses:
        "200":
          description: Solicitação aceita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOkResponse"
              example:
                Status: ok
        "400":
          description: E-mail ausente ou falha ao solicitar recuperação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailObrigatorio:
                  value:
                    Error: E-mail é obrigatório.
                falha:
                  value:
                    Error: Falha ao solicitar recuperação de senha.

  /auth/update-password:
    post:
      tags:
        - Auth
      summary: Atualizar senha usando access_token do Supabase
      description: |
        Atualiza a senha do usuário identificado pelo access_token Supabase.

        Esta rota não usa o JWT local como autenticação principal.
        Ela valida o access_token enviado no body.
      operationId: postAuthUpdatePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordRequest"
            example:
              access_token: supabase-access-token
              newPassword: novaSenhaSegura123
      responses:
        "200":
          description: Senha atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePasswordSuccess"
              example:
                Status: ok
                updated: true
        "400":
          description: Campos ausentes ou falha ao atualizar senha.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                camposObrigatorios:
                  value:
                    Error: access_token e newPassword são obrigatórios.
        "401":
          description: access_token inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Token inválido.

  /auth/me:
    get:
      tags:
        - Auth
      summary: Verificar sessão local autenticada
      description: |
        Retorna o payload do JWT local quando a sessão está ativa.

        Aceita autenticação via cookie "token" ou Authorization Bearer.
      operationId: getAuthMe
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Sessão ativa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeSuccess"
              example:
                Status: ok
                user:
                  sub: 11111111-1111-4111-8111-111111111111
                  last: 1710000000000
                  anon: false
                  nome: Maria Paciente
                  email: paciente@example.com
                  tipo: paciente
                  cpf: "12345678901"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "440":
          $ref: "#/components/responses/IdleTimeout"

  /logout:
    post:
      tags:
        - Auth
      summary: Encerrar sessão local
      description: |
        Limpa o cookie local "token".

        Não revoga sessão Supabase e não apaga usuário.
      operationId: postLogout
      responses:
        "200":
          description: Logout local realizado.
          headers:
            Set-Cookie:
              description: Cookie "token" limpo.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
              example:
                Status: Logged out

  /consent:
    post:
      tags:
        - Chat
      summary: Criar sessão anônima para chat
      description: |
        Cria uma sessão anônima local com UUID aleatório e salva no cookie "token".

        Esta sessão permite usar /send-message-n8n sem usuário cadastrado.
        Para anônimos, o backend envia id_usuario null ao n8n e usa o webhook de paciente.
      operationId: postConsent
      responses:
        "200":
          description: Consentimento aceito e sessão anônima criada.
          headers:
            Set-Cookie:
              description: Cookie HTTP-only "token" com JWT anônimo.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentSuccess"
              example:
                Status: Consent accepted
                created: true

  /send-message-n8n:
    post:
      tags:
        - Chat
      summary: Enviar mensagem para agente n8n
      description: |
        Envia uma mensagem para o webhook n8n.

        Regras de roteamento:
          - Sessão anônima:
              identifier = UUID anônimo do JWT
              id_usuario = null
              tipo_usuario = null
              webhook = paciente
          - Sessão logada:
              identifier = auth_id do Supabase
              id_usuario = id interno da tabela doria.usuario
              tipo_usuario = lido da tabela doria.usuario
              se tipo_usuario contém "especialista", usa webhook especialista
              caso contrário, usa webhook paciente

        O corpo da resposta de sucesso é exatamente response.data retornado pelo n8n,
        sem schema fixo garantido pelo backend.
      operationId: postSendMessageN8n
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageN8nRequest"
            example:
              message: Olá, estou com dor lombar há dois dias.
      responses:
        "200":
          description: Resposta retornada pelo n8n.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/N8nDynamicResponse"
              examples:
                generico:
                  value:
                    response: Mensagem processada pelo agente.
        "400":
          description: Campo message ausente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Message is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Usuário logado não encontrado na tabela usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Usuário não encontrado na tabela usuario.
        "440":
          $ref: "#/components/responses/IdleTimeout"
        "500":
          description: Falha ao consultar roteamento do usuário.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Falha no webhook n8n.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: n8n webhook failed

  /usuario:
    post:
      tags:
        - Usuario
      summary: Criar/atualizar perfil do usuário autenticado
      description: |
        Faz upsert do perfil na tabela doria.usuario para o usuário autenticado.

        No código atual, antes do upsert a rota resolve id_usuario por auth_id.
        Portanto, o perfil precisa já existir para essa rota funcionar.

        Campos proibidos no body:
          - id_usuario
          - uuid
          - auth_id
          - created_at

        Aliases aceitos:
          - tipo -> tipo_usuario
          - sexo -> sexo_biologico
          - "Área de Atuação" -> area_de_atuacao
      operationId: postUsuario
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpsertRequest"
            example:
              nome: Maria Paciente
              cpf: "12345678901"
              email: paciente@example.com
              tipo_usuario: paciente
              data_nascimento: "1990-05-20"
              telefone_pessoal: "11999999999"
              sexo_biologico: 1
              area_de_atuacao: Dor crônica
              notif_medicacoes: true
              notif_jornada: true
              notif_avaliacao: false
              notif_consultas: true
      responses:
        "201":
          description: Perfil criado/atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioMutationSuccessCreated"
        "400":
          description: Validação falhou ou campo protegido foi enviado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                cpfInvalido:
                  value:
                    Error: O campo cpf deve conter 11 dígitos numéricos.
                campoProtegido:
                  value:
                    Error: O campo auth_id não pode ser definido/alterado por esta rota.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Usuário não encontrado na tabela usuario ao resolver sessão.
          content:
            application/json:
              schema:
