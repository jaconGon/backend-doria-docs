  /certificar_especialista:
    post:
      tags:
        - Especialistas
      summary: Certificar especialista via Consultar.IO
      description: |
        Valida o registro profissional do especialista autenticado usando Consultar.IO
        e marca o especialista mais recente do usuário como verificado.

        Regras:
          - Exige sessão autenticada não anônima.
          - Busca o id_usuario pelo auth_id da sessão.
          - Busca o especialista mais recente do usuário autenticado.
          - Se já estiver verificado, retorna 409.
          - Há cooldown de 5 minutos entre tentativas.
          - Se o profissional for encontrado na Consultar.IO, atualiza:
              especialistas.verificado = true

        Tipos aceitos no body:
          - CRM
          - CRO
          - CRBM
          - CRF
          - CRP

        Observação:
          - CRP é aceito na validação inicial, mas no código atual retorna 501,
            pois a rota oficial da Consultar.IO ainda não está habilitada no backend.
          - Para CRF, o campo cidade é obrigatório.
      operationId: postCertificarEspecialista
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificarEspecialistaRequest"
            examples:
              crm:
                value:
                  tipo: CRM
                  codigo: "123456"
                  estado: SP
                  cidade: São Paulo
              crf:
                value:
                  tipo: CRF
                  codigo: "123456"
                  estado: SP
                  cidade: São Paulo
      responses:
        "200":
          description: Especialista certificado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificarEspecialistaSuccess"
              example:
                Status: success
                message: Especialista certificado com sucesso.
                especialista:
                  id_especialista: 99999999-9999-4999-8999-999999999999
                  verificado: true
                profissional:
                  uf: SP
                  regiao: null
                  numero_registro: "123456"
                  categoria: null
                  nome_razao_social: João Silva
                  situacao: Ativo
                  tipo_inscricao: Principal
                  especialidades: Dor
                  cidade: São Paulo
                  data_inscricao: "2010-01-01"
                  data_inscricao_formatada: "01/01/2010"
        "400":
          description: Tipo inválido ou campos obrigatórios ausentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tipoInvalido:
                  value:
                    Error: O campo tipo deve ser CRM, CRO, CRBM, CRF ou CRP.
                codigoEstadoObrigatorios:
                  value:
                    Error: Os campos codigo e estado são obrigatórios.
                cidadeCrfObrigatoria:
                  value:
                    Error: O campo cidade é obrigatório para CRF.
        "401":
          description: Sessão inválida, anônima ou ausente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Sessão inválida para certificação de especialista.
        "404":
          description: Especialista ou profissional não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseWithRetry"
              examples:
                especialistaNaoEncontrado:
                  value:
                    Error: Especialista não encontrado para o usuário autenticado.
                profissionalNaoEncontrado:
                  value:
                    Error: profissional não encontrado aguarde até que você possa verificar novamente
                    retry_after_seconds: 300
        "409":
          description: Especialista já verificado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Aguarde até que você possa consultar novamente.
        "429":
          description: Cooldown de verificação ativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseWithRetry"
              example:
                Error: Aguarde até que você possa consultar novamente.
                retry_after_seconds: 240
        "440":
          $ref: "#/components/responses/IdleTimeout"
        "500":
          description: Erro de banco ou token Consultar.IO ausente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tokenAusente:
                  value:
                    Error: TOKEN_CONSULTARIO não configurado no backend.
        "501":
          description: Consulta CRP não habilitada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Consulta CRP ainda não está habilitada no backend porque a rota oficial da Consultar.IO não foi confirmada.
        "502":
          description: Falha ao consultar serviço de certificação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                Error: Falha ao consultar serviço de certificação profissional.

