openapi: 3.0.3
info:
  title: Fale com a Doria API
  version: 3.1.0
  description: 'Especificação OpenAPI gerada a partir do backend Fastify/TypeScript enviado. Endpoints autenticados aceitam
    JWT via Authorization: Bearer <token> ou cookie httpOnly `token`.'
servers:
- url: https://api.falecomadoria.com.br
  description: Produção
- url: http://localhost:3433
  description: Desenvolvimento local
tags:
- name: Health
- name: Autenticação
- name: Chat
- name: Usuário
- name: Consultas
- name: Minha Jornada
- name: Especialistas
- name: Clínicas
- name: Convênios
- name: Endereços
- name: Horário Atendimento
- name: Medicações
- name: Controle Medicações
- name: Evolução
paths:
  /:
    get:
      summary: Verifica saúde da API e estado da sessão via cookie.
      tags:
      - Health
      security: []
      operationId: get_root_health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /aceitar_termos:
    post:
      summary: Registra aceite dos termos de uso e política de privacidade.
      tags:
      - Usuário
      security:
