components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT local emitido pelo backend e armazenado no cookie HTTP-only "token".
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT local emitido pelo backend, enviado como Authorization Bearer.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: UUID do recurso.
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Token ausente, inválido ou sessão não autenticada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            tokenAusente:
              value:
                Error: token is missing
            tokenInvalido:
              value:
                Error: token is not ok
    IdleTimeout:
      description: Sessão expirada por inatividade.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            Error: token is not ok (idle timeout)
    InvalidUuid:
      description: Parâmetro UUID inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            Error: O parâmetro id deve ser um UUID válido.
    ResourceNotFound:
      description: Recurso não encontrado ou inacessível pelo usuário autenticado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            Error: recurso não encontrado.
    ForbiddenOwner:
      description: O recurso informado não pertence ao usuário autenticado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            Error: Você não tem permissão para acessar este recurso.

  schemas:
    ErrorResponse:
      type: object
      required:
        - Error
      properties:
        Error:
          type: string
      additionalProperties: true

    ErrorResponseWithRetry:
      type: object
      required:
        - Error
      properties:
        Error:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 0
      additionalProperties: true

    StatusOkResponse:
      type: object
      required:
        - Status
      properties:
        Status:
          type: string
          example: ok

    HealthResponse:
      type: object
      required:
        - Status
        - hasSession
      properties:
        Status:
          type: string
          example: Success
        hasSession:
          type: boolean

    AuthSignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        nome:
          type: string
        tipo:
          type: string
          description: Tipo do usuário. Normalmente "paciente" ou "especialista".
          example: paciente
        cpf:
          type: string
          description: CPF com 11 dígitos, preferencialmente sem pontuação.
          example: "12345678901"
      additionalProperties: true

    AuthSignupSuccess:
      type: object
      required:
        - Status
        - auth_id
        - email
        - needs_email_confirm
      properties:
        Status:
          type: string
          example: created
        auth_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        needs_email_confirm:
          type: boolean

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginSuccess:
      type: object
      required:
        - Status
        - token
        - user
      properties:
        Status:
          type: string
          example: success
        token:
          type: string
          description: JWT local do backend.
        user:
          type: object
          required:
            - email
          properties:
            nome:
              type: string
              nullable: true
            email:
              type: string
              format: email
            tipo:
              type: string
              nullable: true

    GoogleAuthRequest:
      type: object
      description: |
        Payload de login/cadastro com Google. O backend aceita id_token ou token como alias.
      anyOf:
        - required:
            - id_token
        - required:
            - token
      properties:
        id_token:
          type: string
          description: ID token emitido pelo Google.
        token:
          type: string
          description: Alias aceito pelo backend para id_token.
        nonce:
          type: string
          description: Nonce opcional usado na validação do id_token.
        tipo:
          type: string
          enum:
            - paciente
            - especialista
          default: paciente
        nome:
          type: string
          description: Nome opcional usado como fallback no cadastro do perfil.
        cpf:
          type: string
          description: CPF com 11 dígitos, preferencialmente sem pontuação.
          example: "12345678901"
      additionalProperties: true

    GoogleAuthSuccess:
      type: object
      required:
        - Status
        - status
        - token
        - user
        - provider
        - created
        - mode
      properties:
        Status:
          type: string
          example: success
        status:
          type: string
          example: success
        token:
          type: string
          description: JWT local do backend.
        user:
          type: object
          required:
            - id_usuario
            - auth_id
            - email
            - tipo
          properties:
            id_usuario:
              type: string
              format: uuid
            auth_id:
              type: string
              format: uuid
            nome:
              type: string
              nullable: true
            email:
              type: string
              format: email
            tipo:
              type: string
              nullable: true
              example: paciente
            cpf:
              type: string
              nullable: true
              example: "12345678901"
            notif_medicacoes:
              type: boolean
              nullable: true
            notif_jornada:
              type: boolean
              nullable: true
            notif_avaliacao:
              type: boolean
              nullable: true
            notif_consultas:
              type: boolean
              nullable: true
        provider:
          type: string
          enum:
            - google
        created:
          type: boolean
          description: Indica se o perfil usuario foi criado neste acesso Google.
        mode:
          type: string
          enum:
            - signup
            - login
          description: 'signup quando created=true; login quando created=false.'

    AccessTokenRequest:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string
          description: Access token válido do Supabase.

    AuthSessionSuccess:
      type: object
      required:
        - Status
        - user
      properties:
        Status:
          type: string
          example: success
        user:
          $ref: "#/components/schemas/Usuario"

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    UpdatePasswordRequest:
      type: object
      required:
        - access_token
        - newPassword
      properties:
        access_token:
          type: string
        newPassword:
          type: string
          minLength: 8

    UpdatePasswordSuccess:
      type: object
      required:
        - Status
        - updated
      properties:
        Status:
          type: string
          example: ok
        updated:
          type: boolean
          example: true

    AuthMeSuccess:
      type: object
      required:
        - Status
        - user
      properties:
        Status:
          type: string
          example: ok
        user:
          $ref: "#/components/schemas/SessionUser"

    SessionUser:
      type: object
      required:
        - sub
        - last
        - anon
      properties:
        sub:
          type: string
          description: auth_id Supabase ou UUID anônimo.
        last:
          type: integer
          format: int64
          description: Timestamp em milissegundos usado para timeout de inatividade.
        anon:
          type: boolean
        nome:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        tipo:
          type: string
          nullable: true
        cpf:
          type: string
          nullable: true

    LogoutSuccess:
      type: object
      required:
        - Status
      properties:
        Status:
          type: string
          example: Logged out

    ConsentSuccess:
      type: object
      required:
        - Status
        - created
      properties:
        Status:
          type: string
          example: Consent accepted
        created:
          type: boolean
          example: true

    SendMessageN8nRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
      additionalProperties: true

    N8nDynamicResponse:
      type: object
      description: |
        Resposta dinâmica retornada diretamente pelo n8n.
        O backend não normaliza o formato desta resposta.
      additionalProperties: true

    Usuario:
      type: object
      properties:
        id_usuario:
          type: string
          format: uuid
        auth_id:
          type: string
          format: uuid
        nome:
          type: string
          nullable: true
        cpf:
          type: string
          nullable: true
          example: "12345678901"
        created_at:
          type: string
          format: date-time
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        tipo_usuario:
          type: string
          nullable: true
          example: paciente
        data_nascimento:
          type: string
          format: date
          nullable: true
        telefone_pessoal:
          type: string
          nullable: true
        sexo_biologico:
          type: integer
          nullable: true
        area_de_atuacao:
          type: string
          nullable: true
        notif_medicacoes:
          type: boolean
          nullable: true
        notif_jornada:
          type: boolean
          nullable: true
        notif_avaliacao:
          type: boolean
          nullable: true
        notif_consultas:
          type: boolean
          nullable: true
      additionalProperties: true

    UsuarioUpsertRequest:
      type: object
      description: |
        Campos aceitos para criação/atualização do perfil.

        Campos protegidos e não aceitos:
          - id_usuario
          - uuid
          - auth_id
          - created_at

        Aliases aceitos:
          - tipo -> tipo_usuario
          - sexo -> sexo_biologico
          - Área de Atuação -> area_de_atuacao
      properties:
        nome:
          type: string
        cpf:
          type: string
          example: "12345678901"
        email:
          type: string
          format: email
        tipo_usuario:
          type: string
        tipo:
          type: string
        data_nascimento:
          type: string
          format: date
        telefone_pessoal:
          type: string
        sexo_biologico:
          type: integer
        sexo:
          type: integer
        area_de_atuacao:
          type: string
        Área de Atuação:
          type: string
        notif_medicacoes:
          type: boolean
        notif_jornada:
          type: boolean
        notif_avaliacao:
          type: boolean
        notif_consultas:
          type: boolean
      additionalProperties: true

    UsuarioMutationSuccessCreated:
      type: object
      required:
        - Status
        - usuario
      properties:
        Status:
          type: string
          example: created
        usuario:
          $ref: "#/components/schemas/Usuario"

    UsuarioMutationSuccessUpdated:
      type: object
      required:
        - Status
        - usuario
      properties:
        Status:
          type: string
          example: updated
        usuario:
          $ref: "#/components/schemas/Usuario"

    UsuarioMutationSuccessDeleted:
      type: object
      required:
        - Status
        - usuario
      properties:
        Status:
          type: string
          example: deleted
        usuario:
          $ref: "#/components/schemas/Usuario"

    UsuarioSingleSuccess:
      type: object
      required:
        - Status
        - usuario
      properties:
        Status:
          type: string
          example: success
        usuario:
          $ref: "#/components/schemas/Usuario"

    UsuarioListSuccess:
      type: object
      required:
        - Status
        - total
        - usuarios
      properties:
        Status:
          type: string
          example: success
        total:
          type: integer
        usuarios:
          type: array
          items:
            $ref: "#/components/schemas/Usuario"

    Consulta:
      type: object
      properties:
        id_consultas:
          type: string
          format: uuid
        id_usuario:
          type: string
          format: uuid
        medico:
          type: string
        data_hora:
          type: string
          format: date-time
        notificacao:
          type: boolean
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
