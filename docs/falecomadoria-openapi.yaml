components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Use o access token retornado em `token`: Authorization: Bearer <token>.'
    AccessCookie:
      type: apiKey
      in: cookie
      name: token
      description: Cookie HttpOnly `token` usado no fluxo web.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Cookie HttpOnly `refresh_token`, aceito somente em POST /auth/refresh.
  responses:
    BadRequest:
      description: Requisição inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Não autenticado, token inválido ou token expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Acesso negado para este recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflito de estado/regra de negócio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Limite/cooldown de tentativa atingido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        Retry-After:
          description: Tempo sugerido até nova tentativa, em segundos.
          schema:
            type: integer
    IdleTimeout:
      description: Sessão inativa. O app deve tentar POST /auth/refresh; se falhar, redirecionar para login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Erro interno da API.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Falha em serviço externo, como n8n.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        Error:
          type: string
        error:
          type: string
        retry_after_seconds:
          type: integer
      additionalProperties: true
      example:
        Error: Mensagem de erro
        error: Mensagem de erro
    PublicUser:
      type: object
      properties:
        id_usuario:
          type: string
          format: uuid
        auth_id:
          type: string
          format: uuid
        nome:
          type: string
          nullable: true
        email:
          type: string
          format: email
        tipo:
          type: string
          enum:
          - paciente
          - especialista
        cpf:
          type: string
          nullable: true
        notif_medicacoes:
          type: boolean
          nullable: true
        notif_jornada:
          type: boolean
          nullable: true
        notif_avaliacao:
          type: boolean
          nullable: true
        notif_consultas:
          type: boolean
          nullable: true
        termos_uso_aceito:
          type: boolean
          nullable: true
        politica_privacidade_aceita:
          type: boolean
          nullable: true
        versao_termo:
          type: string
          nullable: true
      additionalProperties: true
    JwtSessionPayload:
      type: object
      properties:
        sub:
          type: string
          format: uuid
        last:
          type: integer
          format: int64
        anon:
          type: boolean
        doctorId:
          type: string
          nullable: true
        nome:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        tipo:
          type: string
          nullable: true
        cpf:
          type: string
          nullable: true
      additionalProperties: true
    AuthSuccessResponse:
      type: object
      required:
      - Status
      - status
      - token
      - refresh_token
      - user
      properties:
        Status:
          type: string
          example: success
        status:
          type: string
          example: success
        token:
          type: string
          description: Access token JWT curto da API.
        refresh_token:
          type: string
          description: Refresh token JWT longo da API.
        refreshToken:
          type: string
          description: Alias camelCase de refresh_token.
        user:
          $ref: '#/components/schemas/PublicUser'
        provider:
          type: string
        created:
          type: boolean
        mode:
          type: string
        refreshed:
          type: boolean
        precisa_aceitar_termos:
          type: boolean
        nova_versao:
          type: string
      additionalProperties: true
    SignupRequest:
      type: object
      required:
      - email
      - password
      - nome
      - tipo
      properties:
        email:
          type: string
          format: email
