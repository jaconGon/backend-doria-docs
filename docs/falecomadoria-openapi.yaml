openapi: 3.0.3
info:
  title: Documentação da API do Backend Fastify
  version: 1.0.0
  description: Especificação OpenAPI gerada por inspeção estática do backend enviado. O projeto não foi executado; endpoints CRUD gerados por
    createCrudResourceRoutes foram expandidos conforme a factory em src/modules/common/crudResource.ts.
  x-endpoint-count: 102
servers:
- url: http://localhost:3433
  description: Servidor local conforme PORT padrão do src/config/index.ts
tags:
- name: Health
- name: Auth
- name: Chat
- name: Usuário
- name: Termos
- name: Especialistas
- name: Clínicas
- name: Convênios
- name: Consultas
- name: Endereços
- name: Medicações
- name: Controle de Medicações
- name: Minha Jornada
- name: Evolução
- name: Horário de Atendimento
paths:
  /:
    get:
      tags:
      - Health
      summary: Verifica saúde da API e existência de sessão local
      operationId: getHealth
      description: Se houver cookie token válido e dentro da janela de inatividade, retorna hasSession=true; caso contrário, limpa cookie inválido
        e retorna hasSession=false.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                    example: Success
                  hasSession:
                    type: boolean
  /auth/signup:
    post:
      tags:
      - Auth
      summary: Cadastro com e-mail e senha
      operationId: authSignup
      description: Cria usuário no Supabase Auth. Nome e tipo são obrigatórios; CPF é obrigatório para especialista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSignupRequest'
      responses:
        '200':
          description: Cadastro criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSignupResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /login:
    post:
      tags:
      - Auth
      summary: Login com e-mail e senha
      operationId: login
      description: Autentica no Supabase, cria/recupera perfil local e emite JWT/cookies da API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/session:
    post:
      tags:
      - Auth
      summary: Cria sessão local a partir de access_token Supabase
      operationId: authSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessTokenRequest'
      responses:
        '200':
          description: Sessão criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/onboard:
    post:
      tags:
      - Auth
      summary: Cria ou recupera perfil local a partir de access_token Supabase
      operationId: authOnboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessTokenRequest'
      responses:
        '200':
          description: Perfil local criado/recuperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Renova sessão local da API
      operationId: authRefresh
      description: Aceita refresh_token/refreshToken no body ou cookie refresh_token; retorna novo token e refresh token.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Sessão renovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - refreshCookie: []
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Solicita recuperação de senha
      operationId: authForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Solicitação enviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/update-password:
    post:
      tags:
      - Auth
      summary: Atualiza senha com access_token de recovery Supabase
      operationId: authUpdatePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          description: Senha atualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                    example: ok
                  status:
                    type: string
                    example: ok
                  updated:
                    type: boolean
                    example: true
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Alias de atualização de senha
      operationId: authResetPassword
      description: Mesmo comportamento de /auth/update-password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          description: Senha atualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                    example: ok
                  status:
                    type: string
                    example: ok
                  updated:
                    type: boolean
                    example: true
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Verifica usuário da sessão atual
      operationId: authMe
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: Sessão válida
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                    example: ok
                  status:
                    type: string
                    example: ok
                  user:
                    $ref: '#/components/schemas/SessionUser'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '440':
          description: Sessão expirada por inatividade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /logout:
    post:
      tags:
      - Auth
      summary: Logout
      operationId: logout
      description: Limpa cookies de token e refresh_token.
      responses:
        '200':
          description: Logout realizado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                    example: Logged out
                  status:
                    type: string
                    example: logged_out
  /consent:
    post:
      tags:
      - Chat
      summary: Aceita consentimento e cria sessão anônima
      operationId: createAnonymousConsent
      description: Gera UUID anônimo, grava cookie token e permite usar /send-message-n8n.
      responses:
        '200':
          description: Consentimento aceito
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                    example: Consent accepted
                  created:
                    type: boolean
                    example: true
  /send-message-n8n:
    post:
      tags:
      - Chat
      summary: Envia mensagem para webhook n8n
      operationId: sendMessageN8n
      description: Usuários autenticados são roteados por tipo_usuario; sessões anônimas usam o agente de paciente por padrão. A resposta é o
        payload retornado pelo n8n.
      security:
      - bearerAuth: []
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '200':
          description: Mensagem processada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '440':
          description: Sessão expirada por inatividade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha em integração externa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /usuario:
    post:
      tags:
      - Usuário
      summary: Cria/upserta perfil do usuário autenticado
      operationId: createUsuario
      description: Usa auth_id/id_usuario da sessão; não permite definir identificadores manualmente.
      security:
      - bearerAuth: []
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpsertRequest'
      responses:
        '201':
          description: Usuário criado/atualizado
          content:
            application/json:
              schema: &id001
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                  status:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Usuário
      summary: Busca perfil do usuário autenticado
      operationId: getUsuario
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: Usuário retornado
          content:
            application/json:
              schema: *id001
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Usuário
      summary: Atualiza perfil do usuário autenticado
      operationId: updateUsuario
      security:
      - bearerAuth: []
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpsertRequest'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: *id001
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Usuário
      summary: Remove perfil do usuário autenticado
      operationId: deleteUsuario
      description: Remove dados relacionados conforme regras do service e tenta excluir também o usuário do Supabase Auth.
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: Usuário excluído
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                    example: deleted
                  status:
                    type: string
                    example: deleted
                  usuario:
                    $ref: '#/components/schemas/Usuario'
                  auth_user_deleted:
                    type: boolean
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /usuario/por-auth_id/{auth_id}:
    get:
      tags:
      - Usuário
      summary: Busca usuário por auth_id
      operationId: getUsuarioByAuthId
      description: Somente permite consultar o auth_id igual ao sub da sessão.
      parameters:
      - name: auth_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
        description: auth_id do Supabase Auth.
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: Usuário retornado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                  status:
                    type: string
                  total:
                    type: integer
                    example: 1
                  usuarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /aceitar_termos:
    post:
      tags:
      - Termos
      summary: Aceita termos de uso e política de privacidade
      operationId: aceitarTermos
      description: Define termos_uso_aceito e politica_privacidade_aceita como true na versão atual do backend.
      security:
      - bearerAuth: []
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AceitarTermosRequest'
      responses:
        '200':
          description: Termos aceitos
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                    example: updated
                  status:
                    type: string
                    example: updated
                  precisa_aceitar_termos:
                    type: boolean
                    example: false
                  nova_versao:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /convenios:
    post:
      tags:
      - Convênios
      summary: Cria/substitui todos os convênios de uma clínica
      operationId: replaceConvenios
      description: 'O backend substitui a lista inteira de convênios da clínica informada. Para apagar todos, envie envelope com convenios: [].'
      security:
      - bearerAuth: []
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConveniosReplaceRequest'
      responses:
        '201':
          description: Convênios criados/substituídos
          content:
            application/json:
              schema: &id003
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                  status:
                    type: string
                  total:
                    type: integer
                  convenio:
                    $ref: '#/components/schemas/Convenio'
                  convenios:
                    type: array
                    items:
                      $ref: '#/components/schemas/Convenio'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Convênios
      summary: Lista convênios das clínicas do especialista logado
      operationId: listConvenios
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: Convênios listados
          content:
            application/json:
              schema: &id002
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                  status:
                    type: string
                  total:
                    type: integer
                  convenios:
                    type: array
                    items:
                      $ref: '#/components/schemas/Convenio'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /convenios/por-id_clinica/{id_clinica}:
    get:
      tags:
      - Convênios
      summary: Lista convênios por clínica
      operationId: listConveniosByClinica
      parameters:
      - name: id_clinica
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
        description: ID da clínica.
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: Convênios listados
          content:
            application/json:
              schema: *id002
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /convenios/{id}:
    get:
      tags:
      - Convênios
      summary: Busca convênio por ID
      operationId: getConvenio
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
        description: ID do convênio.
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: Convênio retornado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  Status:
                    type: string
                  status:
                    type: string
                  convenio:
                    $ref: '#/components/schemas/Convenio'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
