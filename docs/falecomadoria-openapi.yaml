components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token retornado em login/session/onboard/refresh.
    sessionCookie:
      type: apiKey
      in: cookie
      name: token
      description: Cookie HttpOnly de sessão local da API.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Cookie HttpOnly usado em /auth/refresh.
  schemas:
    Uuid:
      type: string
      format: uuid
      example: 00000000-0000-4000-8000-000000000000
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        Error:
          type: string
        error:
          type: string
        retry_after_seconds:
          type: integer
          nullable: true
        details:
          nullable: true
    StatusResponse:
      type: object
      additionalProperties: true
      properties:
        Status:
          type: string
        status:
          type: string
    SessionUser:
      type: object
      additionalProperties: true
      properties:
        sub:
          $ref: '#/components/schemas/Uuid'
        last:
          type: integer
          format: int64
        anon:
          type: boolean
        doctorId:
          type: string
          nullable: true
        nome:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        tipo:
          type: string
          nullable: true
        cpf:
          type: string
          nullable: true
      required:
      - sub
      - last
      - anon
    AuthUserPublic:
      type: object
      additionalProperties: true
      properties:
        id_usuario:
          $ref: '#/components/schemas/Uuid'
        auth_id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        tipo:
          type: string
          enum:
          - paciente
          - especialista
        cpf:
          type: string
          nullable: true
        notif_medicacoes:
          type: boolean
          nullable: true
        notif_jornada:
          type: boolean
          nullable: true
        notif_avaliacao:
          type: boolean
          nullable: true
        notif_consultas:
          type: boolean
          nullable: true
        termos_uso_aceito:
          type: boolean
          nullable: true
        politica_privacidade_aceita:
          type: boolean
          nullable: true
        versao_termo:
          type: string
          nullable: true
    AuthSignupRequest:
      type: object
      additionalProperties: true
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        nome:
          type: string
        tipo:
          type: string
          enum:
          - paciente
          - especialista
        cpf:
          type: string
          description: Obrigatório para tipo especialista.
      required:
      - email
      - password
      - nome
      - tipo
    AuthSignupResponse:
      type: object
      additionalProperties: true
      properties:
        Status:
          type: string
          example: created
        status:
          type: string
          example: created
        auth_id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        needs_email_confirm:
          type: boolean
    LoginRequest:
      type: object
      additionalProperties: true
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    AuthResponse:
      type: object
      additionalProperties: true
      properties:
        Status:
          type: string
          example: success
        status:
          type: string
          example: success
        token:
          type: string
          description: JWT local da API; também enviado em cookie token.
        refresh_token:
          type: string
          description: Refresh token; também enviado em cookie refresh_token.
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/AuthUserPublic'
        precisa_aceitar_termos:
          type: boolean
          nullable: true
        nova_versao:
          type: string
          nullable: true
        refreshed:
          type: boolean
          nullable: true
    AccessTokenRequest:
      type: object
      additionalProperties: true
      properties:
        access_token:
          type: string
      required:
      - access_token
    RefreshRequest:
      type: object
      description: Envie refresh_token ou refreshToken. Também é aceito cookie HttpOnly refresh_token.
      additionalProperties: true
      properties:
        refresh_token:
          type: string
        refreshToken:
          type: string
    ForgotPasswordRequest:
      type: object
      additionalProperties: true
      properties:
        email:
          type: string
          format: email
      required:
      - email
    UpdatePasswordRequest:
      type: object
      description: Envie newPassword ou new_password.
      additionalProperties: true
      properties:
        access_token:
          type: string
        newPassword:
          type: string
          minLength: 8
        new_password:
          type: string
          minLength: 8
      required:
      - access_token
    MessageRequest:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
      required:
      - message
    Usuario:
      type: object
      additionalProperties: true
      properties:
        id_usuario:
          $ref: '#/components/schemas/Uuid'
        auth_id:
          $ref: '#/components/schemas/Uuid'
        nome:
          type: string
          nullable: true
        cpf:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        tipo_usuario:
          type: string
          enum:
          - paciente
          - especialista
          nullable: true
        data_nascimento:
          type: string
          format: date
          nullable: true
        telefone_pessoal:
          type: string
          nullable: true
        sexo_biologico:
          type: integer
          nullable: true
        area_de_atuacao:
          type: string
          nullable: true
        notif_medicacoes:
          type: boolean
          nullable: true
        notif_jornada:
          type: boolean
          nullable: true
        notif_avaliacao:
          type: boolean
          nullable: true
        notif_consultas:
          type: boolean
          nullable: true
        termos_uso_aceito:
          type: boolean
          nullable: true
        politica_privacidade_aceita:
          type: boolean
          nullable: true
        versao_termo:
          type: string
          nullable: true
    UsuarioUpsertRequest:
      type: object
      description: Não envie id_usuario, uuid, auth_id, created_at ou versao_termo; esses campos são bloqueados pelo backend.
      additionalProperties: true
      properties:
        nome:
          type: string
        cpf:
          type: string
        email:
          type: string
          format: email
        tipo_usuario:
          type: string
          enum:
          - paciente
          - especialista
        tipo:
          type: string
          enum:
          - paciente
          - especialista
          description: Alias aceito para tipo_usuario.
        data_nascimento:
          type: string
          format: date
        telefone_pessoal:
          type: string
        sexo_biologico:
          type: integer
        sexo:
          type: integer
          description: Alias aceito para sexo_biologico.
        area_de_atuacao:
          type: string
        Área de Atuação:
          type: string
          description: Alias legado aceito para area_de_atuacao.
        notif_medicacoes:
          type: boolean
        notif_jornada:
          type: boolean
        notif_avaliacao:
          type: boolean
        notif_consultas:
          type: boolean
        termos_uso_aceito:
          type: boolean
        politica_privacidade_aceita:
          type: boolean
    AceitarTermosRequest:
      type: object
      additionalProperties: true
      properties:
        termos_uso_aceito:
          type: boolean
          enum:
          - true
        politica_privacidade_aceita:
          type: boolean
          enum:
          - true
        versao_termo:
          type: string
          description: Opcional; se enviado diferente da versão atual, retorna 409.
      required:
      - termos_uso_aceito
      - politica_privacidade_aceita
    Convenio:
      type: object
      additionalProperties: true
      properties:
        id_convenio:
          $ref: '#/components/schemas/Uuid'
        id_clinica:
          $ref: '#/components/schemas/Uuid'
        nome_convenio:
          type: string
          nullable: true
        descrição:
          type: string
          nullable: true
        criado_em:
          type: string
          format: date-time
          nullable: true
    ConvenioItemRequest:
      type: object
      description: O item precisa ter nome_convenio ou descricao/descrição. id_clinica pode vir no item ou no envelope.
      additionalProperties: true
      properties:
        id_clinica:
          $ref: '#/components/schemas/Uuid'
        nome_convenio:
          type: string
          nullable: true
        descricao:
          type: string
          nullable: true
          description: Alias sem acento para o campo descrição.
        descrição:
          type: string
          nullable: true
    ConveniosEnvelopeRequest:
      type: object
      description: 'Enviar convenios: [] apaga todos os convênios da clínica informada.'
      additionalProperties: true
      properties:
        id_clinica:
          $ref: '#/components/schemas/Uuid'
        convenios:
          type: array
          items:
            $ref: '#/components/schemas/ConvenioItemRequest'
      required:
      - id_clinica
      - convenios
    ConveniosReplaceRequest:
      oneOf:
      - $ref: '#/components/schemas/ConvenioItemRequest'
      - type: array
