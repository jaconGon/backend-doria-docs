    CrudCommonResponses:
      description: |
        Rotas CRUD tambem podem retornar:
        - 401: `{ Error: "you are not authenticated" }`
        - 440: `{ Error: "token is not ok (idle timeout)" }`
        - 400: parametro UUID invalido, campo obrigatorio ausente, tipo invalido, campo protegido, ou update sem campos validos
        - 403: usuario nao tem permissao para acessar o recurso
        - 404: recurso ou registro pai nao encontrado
        - 500: falha em consulta/insert/update/delete no Supabase

  # Respostas genericas usadas pelos CRUDs gerados por createCrudResourceRoutes.
  # A chave concreta do recurso muda conforme a rota: consulta, endereco, medicacao,
  # controle_medicacao, registro, evolucao, especialista, clinica, horario_atendimento.
  x-crud-response-shapes:
    created:
      Status: created
      status: created
      "<singleKey>": {}
    list:
      Status: success
      status: success
      total: 0
      "<listKey>": []
    single:
      Status: success
      status: success
      "<singleKey>": {}
    updated:
      Status: updated
      status: updated
      "<singleKey>": {}
    deleted:
      Status: deleted
      status: deleted
      "<singleKey>": {}

  # Extensao auxiliar para documentar os nomes reais de singleKey/listKey por recurso.
  x-crud-keys:
    consultas: { singleKey: consulta, listKey: consultas }
    agenda-doria: { singleKey: consulta, listKey: consultas }
    enderecos: { singleKey: endereco, listKey: enderecos }
    medicacoes: { singleKey: medicacao, listKey: medicacoes }
    controle-medicacoes: { singleKey: controle_medicacao, listKey: controle_medicacoes }
    minha-jornada: { singleKey: registro, listKey: registros }
    registro-dor: { singleKey: registro, listKey: registros }
    evolucao: { singleKey: evolucao, listKey: evolucoes }
    especialistas: { singleKey: especialista, listKey: especialistas }
    especialista-sbed: { singleKey: especialista, listKey: especialistas }
    clinicas: { singleKey: clinica, listKey: clinicas }
    horario-atendimento: { singleKey: horario_atendimento, listKey: horarios_atendimento }

  # Estes aliases de resposta sao definidos aqui para facilitar leitura em ferramentas
  # que exibem componentes/responses.
  x-note: As respostas CrudCreated/CrudList/CrudSingle/CrudUpdated/CrudDeleted estao descritas em `x-crud-response-shapes`.
